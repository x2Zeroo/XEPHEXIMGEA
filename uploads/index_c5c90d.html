<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เมืองจำลอง NPC — Ecosystem Life Sim</title>
<style>
  :root{
    --bg:#0a0e14;
    --panel:#11161f;
    --panel2:#161c27;
    --line:#222b39;
    --txt:#e6edf3;
    --muted:#8b97a7;
    --accent:#3b82f6;
    --good:#34d399;
    --warn:#f59e0b;
    --bad:#ef4444;
    --pink:#ec9bd1;
    --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,"Noto Sans Thai",sans-serif;height:100%}
  body{display:flex;height:100vh;overflow:hidden}

  /* MAP SIDE */
  .stage{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
  .mapwrap{flex:1;position:relative;overflow:hidden;background:#070b11}
  canvas{display:block;position:absolute;top:0;left:0;cursor:grab}
  canvas:active{cursor:grabbing}
  .bottombar{
    position:absolute;left:14px;bottom:12px;z-index:5;
    background:rgba(7,11,17,.78);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:8px;
    padding:7px 12px;font-size:12px;color:var(--muted)
  }
  .topbar{
    position:absolute;left:14px;top:12px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  }
  .pill{
    background:rgba(7,11,17,.8);border:1px solid var(--line);border-radius:999px;
    padding:5px 11px;font-size:12px;color:var(--txt);display:flex;gap:6px;align-items:center
  }
  .pill b{color:var(--accent)}
  .btn{
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;transition:.15s
  }
  .btn:hover{border-color:var(--accent);background:#1b2330}
  .btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

  /* RIGHT PANEL */
  .panel{
    width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;height:100%
  }
  .ptop{padding:12px 14px;border-bottom:1px solid var(--line)}
  .ptop h1{font-size:15px;font-weight:700;letter-spacing:.2px}
  .ptop .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .speedrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
  .speedrow input[type=range]{flex:1;accent-color:var(--accent)}
  .tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
  .tab{flex:1;padding:10px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--txt);border-bottom-color:var(--accent);font-weight:600}
  .pbody{flex:1;overflow-y:auto;padding:14px}
  .pbody::-webkit-scrollbar{width:8px}
  .pbody::-webkit-scrollbar-thumb{background:#2a3442;border-radius:8px}

  .sec-title{font-size:13px;font-weight:700;margin:4px 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--muted)}
  .chip b{color:var(--txt);margin-left:3px}
  .chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}

  .bar{margin-bottom:11px}
  .bar .lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .bar .lbl span:last-child{color:var(--muted)}
  .track{height:8px;background:#1c2430;border-radius:6px;overflow:hidden}
  .fill{height:100%;border-radius:6px;transition:width .3s}

  .gov-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .gov-row span:last-child{color:var(--muted)}
  .narr{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.55;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .log{font-size:11.5px;color:var(--muted);line-height:1.7}
  .log div{padding:3px 0;border-bottom:1px dashed var(--line)}
  .log b{color:var(--txt)}

  /* settings */
  .field{margin-bottom:10px}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:8px;font-size:12px}
  .hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px}

  /* NPC popup */
  .npccard{
    position:absolute;z-index:20;width:250px;background:rgba(12,17,25,.97);
    border:1px solid var(--accent);border-radius:10px;padding:12px;font-size:12px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);pointer-events:none
  }
  .npccard h3{font-size:13.5px;margin-bottom:2px}
  .npccard .role{color:var(--muted);font-size:11px;margin-bottom:8px}
  .npccard .nbar{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:11px}
  .npccard .nbar .nt{width:42px;color:var(--muted)}
  .npccard .nbar .ntrack{flex:1;height:6px;background:#1c2430;border-radius:5px;overflow:hidden}
  .npccard .nbar .nf{height:100%;border-radius:5px}
  .npccard .think{margin-top:8px;font-style:italic;color:var(--txt);border-top:1px dashed var(--line);padding-top:8px;line-height:1.5}

  .legend{position:absolute;right:12px;bottom:12px;z-index:5;background:rgba(7,11,17,.8);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11px;color:var(--muted)}
  .legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

  @media(max-width:820px){
    body{flex-direction:column}
    .panel{width:100%;min-width:0;height:46%;border-left:none;border-top:1px solid var(--line)}
    .stage{height:54%}
  }
</style>
</head>
<body>
  <!-- ================= MAP ================= -->
  <div class="stage">
    <div class="mapwrap" id="mapwrap">
      <canvas id="cv"></canvas>
      <div class="topbar">
        <div class="pill">📅 วันที่ <b id="dayNum">1</b></div>
        <div class="pill">🕐 <b id="clock">06:00</b></div>
        <div class="pill">👥 <b id="popNum">0</b></div>
        <button class="btn" id="pauseBtn">⏸ หยุด</button>
      </div>
      <div class="bottombar">ลากเมาส์เพื่อเลื่อนแผนที่ • หมุนล้อเพื่อซูม • คลิก NPC เพื่อดูรายละเอียด</div>
      <div class="legend" id="legend"></div>
      <div class="npccard" id="npccard" style="display:none"></div>
    </div>
  </div>

  <!-- ================= PANEL ================= -->
  <div class="panel">
    <div class="ptop">
      <h1>เมืองจำลอง NPC</h1>
      <div class="sub">ระบบนิเวศ • นิสัย • ความต้องการ • การตัดสินใจคล้ายคน</div>
      <div class="speedrow">
        <span>ความเร็ว</span>
        <input type="range" id="speed" min="0" max="6" step="1" value="3">
        <span id="speedLbl">1x</span>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" data-t="overview">ภาพรวมเมือง</div>
      <div class="tab" data-t="economy">เศรษฐกิจ</div>
      <div class="tab" data-t="gov">การปกครอง</div>
      <div class="tab" data-t="settings">AI / ตั้งค่า</div>
    </div>
    <div class="pbody" id="pbody"></div>
  </div>

<script>
"use strict";
/* =========================================================================
   เมืองจำลอง NPC — Ecosystem Life Simulation (single file, no login needed)
   "สมอง" ของ NPC ใช้ Utility AI (rule-based) จำลองการตัดสินใจคล้ายคน
   เสียบ AI API จริงทีหลังได้ที่แท็บ "AI / ตั้งค่า" (OpenAI-compatible)
   ========================================================================= */

/* ---------- AI hook (optional, ใส่ทีหลังได้ ไม่ต้องล็อกอิน) ---------- */
const AI = {
  endpoint: localStorage.getItem('ai_endpoint') || '',   // เช่น https://api.openai.com/v1/chat/completions
  apiKey:   localStorage.getItem('ai_key') || '',
  model:    localStorage.getItem('ai_model') || 'gpt-4o-mini',
  enabled(){ return !!(this.endpoint && this.apiKey); }
};
async function aiThought(npc){
  // ถ้ายังไม่เสียบ AI → ใช้ local generator (ทำงานได้ทันที)
  if(!AI.enabled()) return localThought(npc);
  try{
    const sys = "คุณคือ NPC ในเกมจำลองเมือง พูดความในใจสั้นๆ 1 ประโยคเป็นภาษาไทย ตามสถานะที่ให้";
    const usr = `ชื่อ ${npc.name} อาชีพ ${npc.job||'ว่างงาน'} เงิน ${npc.money}฿ `+
      `อิ่ม ${npc.need.hunger|0}% พลัง ${npc.need.energy|0}% สนุก ${npc.need.fun|0}% สังคม ${npc.need.social|0}% `+
      `กำลัง ${ACT[npc.act].label}`;
    const r = await fetch(AI.endpoint,{method:'POST',headers:{
      'Content-Type':'application/json','Authorization':'Bearer '+AI.apiKey},
      body:JSON.stringify({model:AI.model,messages:[{role:'system',content:sys},{role:'user',content:usr}],max_tokens:50,temperature:0.9})
    });
    const j = await r.json();
    return j.choices?.[0]?.message?.content?.trim() || localThought(npc);
  }catch(e){ return localThought(npc); }
}

/* ---------- การกำหนดกิจกรรม + สีของ NPC ---------- */
const ACT = {
  sleep:    {label:'นอนหลับ',     color:'#64748b'},
  home:     {label:'อยู่บ้าน',    color:'#7dd3fc'},
  commute:  {label:'เดินทาง',     color:'#cbd5e1'},
  work:     {label:'ทำงาน',       color:'#f59e0b'},
  eat:      {label:'กิน/ตลาด',    color:'#22d3ee'},
  leisure:  {label:'พักผ่อน',     color:'#ec9bd1'},
  social:   {label:'เข้าสังคม',   color:'#a78bfa'},
  jobhunt:  {label:'หางาน',       color:'#fbbf24'},
  shop:     {label:'ช้อปปิ้ง',    color:'#34d399'},
  sick:     {label:'ป่วย',        color:'#ef4444'},
};

/* ---------- โซน/อาคารบนแผนที่ (พิกัดโลก) ---------- */
const W = 1400, H = 900; // โลกแผนที่
const ZONES = [
  {id:'res',  name:'ที่อยู่อาศัย', type:'home',    x:120, y:430, w:300, h:240, col:'#1f3a5f'},
  {id:'biz',  name:'ย่านธุรกิจ',  type:'office',  x:520, y:300, w:240, h:200, col:'#3a2f5f'},
  {id:'fac',  name:'โรงงาน',      type:'factory', x:120, y:120, w:260, h:200, col:'#5f3a2f'},
  {id:'farm', name:'ฟาร์ม/เกษตร', type:'farm',    x:760, y:90,  w:300, h:190, col:'#2f5f33'},
  {id:'mkt',  name:'ตลาด',        type:'market',  x:560, y:560, w:230, h:170, col:'#2f5f5a'},
  {id:'park', name:'สวนสาธารณะ',  type:'leisure', x:840, y:340, w:240, h:200, col:'#2a6b3a'},
  {id:'mine', name:'เหมืองแร่',   type:'mine',    x:1080,y:110, w:240, h:180, col:'#4a4a52'},
  {id:'port', name:'ท่าเรือ',     type:'port',    x:1060,y:560, w:260, h:200, col:'#2f4a6b'},
  {id:'gov',  name:'ศาลากลาง',    type:'office',  x:420, y:660, w:180, h:150, col:'#5f5a2f'},
];
const WATER = {x:980,y:480,w:420,h:420}; // ทะเลมุมขวาล่าง (วาดประกอบ)
const ROADS = [ // เส้นถนนเชื่อมโซน (วาดประกอบ)
  [270,430,640,400],[640,400,690,560],[270,320,270,430],[640,300,920,280],
  [920,280,1200,200],[690,560,1190,560],[510,735,640,560],[420,735,510,735]
];
function zoneById(id){return ZONES.find(z=>z.id===id);}
function zonesByType(t){return ZONES.filter(z=>z.type===t);}
function randInZone(z){return {x:z.x+20+Math.random()*(z.w-40), y:z.y+20+Math.random()*(z.h-40)};}
function zoneCenter(z){return {x:z.x+z.w/2,y:z.y+z.h/2};}

/* ---------- งาน/อาชีพ ---------- */
const JOBS = [
  {title:'พนักงานออฟฟิศ', zone:'biz',  wage:14, shift:[9,17]},
  {title:'คนงานโรงงาน',   zone:'fac',  wage:11, shift:[8,17]},
  {title:'เกษตรกร',       zone:'farm', wage:9,  shift:[6,15]},
  {title:'พ่อค้าแม่ค้า',  zone:'mkt',  wage:12, shift:[8,18]},
  {title:'คนงานเหมือง',   zone:'mine', wage:16, shift:[7,16]},
  {title:'กรรมกรท่าเรือ', zone:'port', wage:13, shift:[7,17]},
  {title:'ข้าราชการ',     zone:'gov',  wage:13, shift:[9,16]},
];

/* ---------- ชื่อ NPC ---------- */
const FN = ['พลอย','ฟ้า','มุก','ลิน','ไห','ข้าว','แนท','พาย','บีม','โอม','นนท์','ใบเฟิร์น','กานต์','ปัน','มิ้นท์','ตูน','เอิร์ธ','ไอซ์','น้ำ','ดิน','พีท','จูน','แพร','ก้อง','ตาล','หนิง','โบว์','เจม','ปาล์ม','ใบบุญ'];
const LN = ['เมืองใหม่','สายลม','ฟ้าใส','บ้านสวน','ภูเขียว','ทะเลกว้าง','ดาวเหนือ','ใจดี','รักไทย','ทองดี','ศรีสุข','พิทักษ์','มั่นคง','รุ่งเรือง'];

/* ---------- NPC ---------- */
let NPCS = [];
function makeNPC(i){
  const home = randInZone(zoneById('res'));
  const p = {
    laziness:   Math.random(),   // ขี้เกียจ
    ambition:   Math.random(),   // ทะเยอทะยาน (หางานเก่ง)
    sociable:   Math.random(),   // ชอบสังคม
    fun:        Math.random(),   // ชอบความสนุก
    thrift:     0.3+Math.random()*0.6, // ประหยัด
  };
  return {
    id:i,
    name: FN[i%FN.length] + ' ' + LN[(i*7)%LN.length],
    age: 18 + (i*13)%48,
    x: home.x, y: home.y, homePos: home,
    tx: home.x, ty: home.y,
    speed: 0.6 + Math.random()*0.5,
    money: 40 + Math.random()*120 | 0,
    job: null, jobInfo:null, workPos:null,
    need:{ hunger: 50+Math.random()*40, energy: 60+Math.random()*30, fun: 40+Math.random()*40, social: 40+Math.random()*40 },
    pers:p,
    act:'home', actTimer:0, arrived:true,
    sick:false, sickTimer:0,
    thought:'', thoughtTimer:0,
    lastZone:'res',
  };
}

/* ---------- เวลา/เมือง ---------- */
const SIM = {
  day:1, hour:6, min:0,
  paused:false,
  speed:3,                         // index ใน SPEEDS
  budget: 5000, taxRate:0.18, welfare:0.16, approval:0.55,
  leader:'พาย เมืองใหม่', policy:'สร้างงานใหญ่',
  electionIn: 5,
  narrative:'เมืองเพิ่งเริ่มต้นวันใหม่ ผู้คนตื่นขึ้นเตรียมตัวไปทำงาน',
  log:[],
};
const SPEEDS = [0,0.25,0.5,1,2,4,8]; // 0 = pause
const SPEED_LBL = ['หยุด','0.25x','0.5x','1x','2x','4x','8x'];

/* =========================================================================
   UTILITY AI — การตัดสินใจคล้ายคน
   แต่ละ tick คำนวณ "คะแนนความอยาก" ของแต่ละ action จากความต้องการ+บริบท+นิสัย
   แล้วเลือก action ที่คะแนนสูงสุด (มี hysteresis กันเปลี่ยนใจถี่)
   ========================================================================= */
function decide(n){
  const h = SIM.hour + SIM.min/60;
  const need = n.need;
  const night = (h>=22 || h<6);

  // ป่วย → พักรักษาตัวที่บ้านจนกว่าจะหาย
  if(n.sick){ return 'sick'; }

  const score = {};

  // นอน: พลังต่ำ + กลางคืน
  score.sleep = (night?0.6:0) + (100-need.energy)/100*0.9 + n.pers.laziness*0.2;

  // กิน: หิว + มีเงิน
  const canEat = n.money >= 8;
  score.eat = (100-need.hunger)/100*1.1 * (canEat?1:0.15) + (need.hunger<25?0.6:0);

  // ทำงาน: มีงาน + อยู่ในกะ + พลังพอ
  if(n.job){
    const [s,e]=n.jobInfo.shift;
    const inShift = h>=s && h<e;
    score.work = (inShift?0.95:0) * (need.energy>15?1:0.2);
    if(inShift) score.work += n.pers.ambition*0.15 - n.pers.laziness*0.25;
    if(need.hunger<10) score.work -= 0.3; // หิวมากขอไปกินก่อน
  } else {
    // หางาน: กลางวัน + ทะเยอทะยาน + (เงินน้อยยิ่งอยาก)
    const dayTime = h>=8 && h<17;
    score.jobhunt = (dayTime?0.7:0) + n.pers.ambition*0.5 + (n.money<60?0.5:0);
  }

  // พักผ่อน: สนุกต่ำ
  score.leisure = (100-need.fun)/100*0.8 * (h>7&&h<22?1:0.2) + n.pers.fun*0.2;

  // เข้าสังคม: สังคมต่ำ
  score.social = (100-need.social)/100*0.75 * (h>9&&h<22?1:0.2) + n.pers.sociable*0.25;

  // ช้อปปิ้ง: มีเงินเหลือเยอะ + ไม่ประหยัด
  score.shop = (n.money>150?0.5:0) * (1-n.pers.thrift) * (h>10&&h<20?1:0);

  // อยู่บ้านเฉยๆ (ค่า baseline)
  score.home = 0.2 + n.pers.laziness*0.15;

  // ความเร่งด่วนวิกฤต override
  if(need.energy<12) score.sleep += 1.2;
  if(need.hunger<12 && canEat) score.eat += 1.2;

  // เลือกคะแนนสูงสุด
  let best='home', bv=-1;
  for(const k in score){ if(score[k]>bv){bv=score[k];best=k;} }

  // hysteresis: ถ้า action เดิมยังคะแนนใกล้เคียง ไม่ต้องเปลี่ยน
  if(n.act!==best && score[n.act]!==undefined && score[n.act] > bv-0.18 && n.arrived){
    return n.act;
  }
  return best;
}

/* กำหนดเป้าหมายตาม action */
function setTarget(n){
  let z, p;
  switch(n.act){
    case 'sleep': case 'home': case 'sick': p=n.homePos; z='res'; break;
    case 'work': p=n.workPos; z=n.jobInfo.zone; break;
    case 'eat': z='mkt'; p=randInZone(zoneById('mkt')); break;
    case 'shop': z='mkt'; p=randInZone(zoneById('mkt')); break;
    case 'leisure': z='park'; p=randInZone(zoneById('park')); break;
    case 'social': z=Math.random()<0.5?'park':'mkt'; p=randInZone(zoneById(z)); break;
    case 'jobhunt': { const J=JOBS[Math.random()*JOBS.length|0]; n._target=J; z=J.zone; p=randInZone(zoneById(z)); break; }
    default: p=n.homePos; z='res';
  }
  n.tx=p.x; n.ty=p.y; n.arrived=false; n.lastZone=z;
}

/* ดำเนินผลของ action เมื่อถึงที่หมาย (เรียกทุก sim-tick) */
function applyAction(n, dt){
  const need=n.need;
  switch(n.act){
    case 'sleep':
      need.energy = Math.min(100, need.energy + 14*dt);
      need.hunger = Math.max(0, need.hunger - 1.5*dt);
      break;
    case 'home':
      need.energy = Math.min(100, need.energy + 3*dt);
      need.fun = Math.min(100, need.fun + 1*dt);
      need.hunger = Math.max(0, need.hunger - 2.5*dt);
      break;
    case 'work': {
      const [s,e]=n.jobInfo.shift, h=SIM.hour+SIM.min/60;
      if(h>=s && h<e){
        const pay = n.jobInfo.wage*dt;
        n.money += pay;
        SIM.budget += pay*SIM.taxRate; // ภาษีเข้าเมือง
        need.energy = Math.max(0, need.energy - 4*dt);
        need.hunger = Math.max(0, need.hunger - 3*dt);
        need.fun = Math.max(0, need.fun - 1.5*dt);
      } else { n.actTimer=0; } // หมดกะ → ออก
      break;
    }
    case 'eat':
      if(n.money>=8){
        const cost=(6+Math.random()*8)*dt;
        n.money-=cost; SIM.budget += cost*SIM.taxRate;
        need.hunger=Math.min(100,need.hunger+55*dt);
        need.social=Math.min(100,need.social+2*dt);
      } else {
        // ไม่มีเงินกิน → กลับบ้านกินของในตู้เย็นเล็กน้อย
        need.hunger=Math.min(100,need.hunger+8*dt);
      }
      break;
    case 'shop':
      if(n.money>=20){
        const cost=15+Math.random()*30;
        n.money-=cost; SIM.budget += cost*SIM.taxRate;
        need.fun=Math.min(100,need.fun+10*dt);
      }
      break;
    case 'leisure':
      need.fun=Math.min(100,need.fun+13*dt);
      need.energy=Math.min(100,need.energy+1.5*dt);
      need.hunger=Math.max(0,need.hunger-1.5*dt);
      break;
    case 'social':
      need.social=Math.min(100,need.social+10*dt);
      need.fun=Math.min(100,need.fun+4*dt);
      need.hunger=Math.max(0,need.hunger-2*dt);
      break;
    case 'jobhunt': {
      // โอกาสได้งาน ขึ้นกับความทะเยอทะยาน + นโยบายสร้างงาน
      const J=n._target;
      const chance = (0.03 + n.pers.ambition*0.05) * (SIM.policy==='สร้างงานใหญ่'?1.6:1) * dt;
      if(J && Math.random()<chance){
        n.job=J.title; n.jobInfo=J;
        n.workPos=randInZone(zoneById(J.zone));
        pushLog(`<b>${n.name}</b> ได้งานเป็น ${J.title} แล้ว!`);
        n.act='home'; n.arrived=false; setTarget(n);
      }
      break;
    }
    case 'sick':
      need.energy=Math.min(100,need.energy+5*dt);
      n.sickTimer-=dt;
      if(n.sickTimer<=0){ n.sick=false; }
      break;
  }
}

/* =========================================================================
   LOOP หลัก
   ========================================================================= */
let acc=0, last=performance.now();
function tick(now){
  const real=(now-last)/1000; last=now;
  const mult=SPEEDS[SIM.speed];
  if(!SIM.paused && mult>0){
    // 1 sim-hour ใช้เวลาจริง ~ (สเกล) วินาที; แปลงเป็น dt (หน่วยชั่วโมง)
    const simHoursPerSec = 0.35*mult;       // ความเร็วเวลา
    let dtH = real*simHoursPerSec;
    advance(dtH);
  }
  render();
  requestAnimationFrame(tick);
}
function advance(dtH){
  // เดินเวลา
  let totalMin = SIM.hour*60+SIM.min + dtH*60;
  while(totalMin>=1440){ totalMin-=1440; newDay(); }
  SIM.hour=Math.floor(totalMin/60); SIM.min=Math.floor(totalMin%60);

  // อัปเดต NPC
  for(const n of NPCS){
    // ความต้องการลดลงตามเวลา (decay)
    const d=Math.min(dtH,0.4); // กันเวลากระโดดทีละมากตอนเร่งเร็ว
    if(n.sick){
      // ป่วยอยู่บ้าน: ค่อยๆ ฟื้น ไม่หิว/อ่อนแรงเพิ่ม (กันวงจรมรณะ)
      n.need.hunger=Math.min(100,n.need.hunger + 3*d);
      n.need.energy=Math.min(100,n.need.energy + 6*d);
      n.need.fun=Math.max(0,n.need.fun - 1.0*d);
      n.need.social=Math.max(0,n.need.social - 0.8*d);
    } else {
      n.need.hunger=Math.max(0,n.need.hunger - 1.9*d);
      n.need.energy=Math.max(0,n.need.energy - 1.4*d);
      n.need.fun=Math.max(0,n.need.fun - 1.0*d);
      n.need.social=Math.max(0,n.need.social - 0.8*d);
      // ป่วยเฉพาะตอนหิวจัด+อ่อนแรงพร้อมกันเท่านั้น และโอกาสต่ำ
      if(n.need.hunger<3 && n.need.energy<6 && Math.random()<0.03*d){
        n.sick=true; n.sickTimer=2+Math.random()*2;
        pushLog(`<b>${n.name}</b> ล้มป่วยเพราะดูแลตัวเองไม่ไหว`);
      }
    }

    // ตัดสินใจใหม่เป็นระยะ
    n.actTimer-=d;
    if(n.actTimer<=0 || (n.arrived && actDone(n))){
      const newAct=decide(n);
      if(newAct!==n.act || !n._target){
        n.act=newAct;
        setTarget(n);
      }
      n.actTimer=0.4+Math.random()*0.8; // ทบทวนทุก ~0.5 ชม.
    }

    // เคลื่อนที่
    moveNPC(n,d);

    // ทำกิจกรรมเมื่อถึงที่หมาย
    if(n.arrived) applyAction(n,d);

    // ความคิด (thought) อัปเดตเป็นระยะ
    n.thoughtTimer-=d;
    if(n.thoughtTimer<=0){
      n.thoughtTimer=2+Math.random()*3;
      // ใช้ local ทันที (async AI เฉพาะตอนเปิด popup)
      n.thought=localThought(n);
    }
  }
  computeStats();
}
function actDone(n){
  // กิจกรรมบางอย่าง "ทำเสร็จ" เมื่อความต้องการเต็ม → ออกไปทำอย่างอื่น
  if(n.act==='eat'&&n.need.hunger>92) return true;
  if(n.act==='sleep'&&n.need.energy>95) return true;
  if(n.act==='leisure'&&n.need.fun>92) return true;
  if(n.act==='social'&&n.need.social>92) return true;
  if(n.act==='shop'&&n.money<25) return true;
  return false;
}
function moveNPC(n,d){
  const dx=n.tx-n.x, dy=n.ty-n.y, dist=Math.hypot(dx,dy);
  if(dist<4){ n.arrived=true; return; }
  const step=n.speed*60*d;
  n.x+=dx/dist*Math.min(step,dist);
  n.y+=dy/dist*Math.min(step,dist);
  if(n.act!=='commute' && !n.arrived){ /* keep activity color while moving but dim */ }
}
function newDay(){
  SIM.day++;
  SIM.electionIn--;
  // เลือกตั้ง
  if(SIM.electionIn<=0){
    runElection();
    SIM.electionIn=5;
  }
  // ความนิยมขึ้นกับอารมณ์เมือง + สวัสดิการ
  const moodAvg=stats.moodAvg||0.5;
  SIM.approval = clamp(SIM.approval*0.6 + (moodAvg*0.3 + SIM.welfare*0.4 + 0.1), 0.05, 0.95);
  // จ่ายสวัสดิการให้คนจน
  for(const n of NPCS){ if(n.money<30){ const w=SIM.welfare*40; if(SIM.budget>w){n.money+=w;SIM.budget-=w;} } }
  SIM.narrative=pickNarrative();
  pushLog(`— วันที่ ${SIM.day}: ${SIM.narrative}`);
}
function runElection(){
  const cands=[
    {n:'พาย เมืองใหม่',p:'สร้างงานใหญ่'},
    {n:'มุก ตลาดน้อย',p:'ลดราคาค่าครองชีพ'},
    {n:'ก้อง ภูเขียว',p:'เพิ่มสวัสดิการ'},
  ];
  const w=cands[Math.random()*cands.length|0];
  SIM.leader=w.n; SIM.policy=w.p;
  if(w.p==='เพิ่มสวัสดิการ') SIM.welfare=Math.min(0.4,SIM.welfare+0.08);
  if(w.p==='ลดราคาค่าครองชีพ') SIM.taxRate=Math.max(0.08,SIM.taxRate-0.04);
  SIM.approval=0.5;
  pushLog(`🗳️ เลือกตั้ง! <b>${w.n}</b> ชนะด้วยนโยบาย "${w.p}"`);
}
function pickNarrative(){
  const arr=[
    `${SIM.leader} ผลักดันนโยบาย "${SIM.policy}"`,
    `ตลาดคึกคัก ผู้คนออกมาจับจ่าย`,
    `โรงงานเปิดรับคนงานเพิ่ม`,
    `อากาศดี ผู้คนออกไปพักผ่อนที่สวน`,
    `เศรษฐกิจเมืองเริ่มฟื้นตัว`,
  ];
  return arr[Math.random()*arr.length|0];
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function pushLog(s){ SIM.log.unshift(`${String(SIM.hour).padStart(2,'0')}:${String(SIM.min).padStart(2,'0')} ${s}`); if(SIM.log.length>40)SIM.log.pop(); }

/* ---------- local thought generator ---------- */
function localThought(n){
  const t=[];
  if(n.sick) t.push('ไม่สบายเลย... ขอพักก่อน');
  if(n.need.hunger<25) t.push('หิวจังเลย อยากกินอะไรสักอย่าง');
  if(n.need.energy<25) t.push('เหนื่อยมาก อยากนอน');
  if(!n.job) t.push('ต้องรีบหางานทำ เงินจะหมดแล้ว');
  if(n.need.fun<25) t.push('เบื่อจัง อยากไปเที่ยวเล่นบ้าง');
  if(n.need.social<25) t.push('เหงา อยากเจอเพื่อนๆ');
  if(n.money>200) t.push('เงินเก็บเริ่มเยอะ อยากซื้อของรางวัลตัวเอง');
  const ctx={
    work:'ตั้งใจทำงานหาเงิน', eat:'อิ่มท้องแล้วค่อยว่ากัน',
    sleep:'ฝันดี...', leisure:'วันนี้ผ่อนคลายสุดๆ', social:'คุยกับเพื่อนสนุกดี',
    jobhunt:'ขอให้ได้งานสักที', home:'อยู่บ้านสบายใจดี', shop:'ของชิ้นนี้น่าซื้อจัง', sick:'ขอพักหน่อยนะ'
  };
  if(t.length) return t[0];
  return ctx[n.act]||'ใช้ชีวิตไปวันๆ';
}

/* =========================================================================
   สถิติเมือง
   ========================================================================= */
let stats={};
function computeStats(){
  const s={count:{},hunger:0,energy:0,fun:0,social:0,employed:0,sick:0,money:0};
  for(const k in ACT)s.count[k]=0;
  for(const n of NPCS){
    s.count[n.sick?'sick':n.act]++;
    s.hunger+=n.need.hunger; s.energy+=n.need.energy; s.fun+=n.need.fun; s.social+=n.need.social;
    if(n.job)s.employed++; if(n.sick)s.sick++; s.money+=n.money;
  }
  const N=NPCS.length||1;
  s.hungerAvg=s.hunger/N; s.energyAvg=s.energy/N; s.funAvg=s.fun/N; s.socialAvg=s.social/N;
  s.moodAvg=(s.hungerAvg+s.energyAvg+s.funAvg+s.socialAvg)/400;
  s.totalMoney=s.money|0;
  stats=s;
}

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const mapwrap=document.getElementById('mapwrap');
let cam={x:0,y:0,zoom:0.62};
let DPR=1, cssW=0, cssH=0;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 3);   // ความละเอียดจริงของจอ (จำกัดไม่เกิน 3 เท่า)
  cssW = mapwrap.clientWidth; cssH = mapwrap.clientHeight;
  cv.width  = Math.round(cssW * DPR);                 // backing store เรนเดอร์คมตามจอ
  cv.height = Math.round(cssH * DPR);
  cv.style.width  = cssW + 'px';                      // ขนาดแสดงผลจริง (CSS pixels)
  cv.style.height = cssH + 'px';
}
window.addEventListener('resize',resize);

function render(){
  // header
  document.getElementById('dayNum').textContent=SIM.day;
  document.getElementById('clock').textContent=`${String(SIM.hour).padStart(2,'0')}:${String(SIM.min).padStart(2,'0')}`;
  document.getElementById('popNum').textContent=NPCS.length;

  // base transform = DPR (ทำให้พิกัดที่ใช้วาดเป็นหน่วย CSS pixel แต่เรนเดอร์คมตามจอจริง)
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // ท้องฟ้าตามเวลา (กลางคืนมืด)
  const h=SIM.hour+SIM.min/60;
  const night=(h>=20||h<6), dusk=(h>=18&&h<20)||(h>=6&&h<8);
  ctx.fillStyle = night? '#05070c' : dusk? '#0c1018' : '#0a1018';
  ctx.fillRect(0,0,cssW,cssH);

  ctx.translate(cam.x,cam.y); ctx.scale(cam.zoom,cam.zoom);

  // พื้นดิน
  ctx.fillStyle='#0e1a14'; ctx.fillRect(-40,-40,W+80,H+80);
  // ทะเล
  ctx.fillStyle='#0d2840'; roundRect(WATER.x,WATER.y,WATER.w,WATER.h,40); ctx.fill();
  ctx.fillStyle='rgba(60,130,200,.15)'; roundRect(WATER.x+20,WATER.y+20,WATER.w-60,WATER.h-60,30); ctx.fill();

  // ถนน
  ctx.strokeStyle='#2a3340'; ctx.lineWidth=10; ctx.lineCap='round';
  for(const r of ROADS){ ctx.beginPath(); ctx.moveTo(r[0],r[1]); ctx.lineTo(r[2],r[3]); ctx.stroke(); }

  // โซน
  for(const z of ZONES){
    ctx.fillStyle=z.col; roundRect(z.x,z.y,z.w,z.h,14); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1.5; ctx.stroke();
    // ลายตึก
    ctx.fillStyle='rgba(255,255,255,.05)';
    for(let i=0;i<6;i++){ const bx=z.x+15+ (i%3)*(z.w-30)/3, by=z.y+15+Math.floor(i/3)*(z.h-30)/2; ctx.fillRect(bx,by,(z.w-50)/3,(z.h-40)/2); }
    // ชื่อ
    ctx.fillStyle='rgba(230,237,243,.92)'; ctx.font='bold 17px "Segoe UI",sans-serif'; ctx.textAlign='center';
    ctx.fillText(z.name, z.x+z.w/2, z.y-8);
  }

  // NPC
  for(const n of NPCS){
    const c=ACT[n.sick?'sick':n.act].color;
    const moving=!n.arrived;
    ctx.beginPath();
    ctx.fillStyle=c;
    ctx.globalAlpha=moving?0.85:1;
    ctx.arc(n.x,n.y, n.id===selectedId?6:3.6, 0, Math.PI*2);
    ctx.fill();
    if(n.id===selectedId){
      ctx.globalAlpha=1; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(n.x,n.y,11,0,Math.PI*2); ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1; ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  // overlay กลางคืน
  if(night){ ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle='rgba(5,10,25,.32)'; ctx.fillRect(0,0,cssW,cssH); }

  renderPanel();
  positionNpcCard();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

   <input type="range" min="5" max="45" value="${Math.round(SIM.taxRate*100)}" style="width:100%;accent-color:var(--accent)" oninput="SIM.taxRate=this.value/100;document.getElementById('taxV').textContent=this.value+'%'"></div>
  <div class="bar"><div class="lbl"><span>งบสวัสดิการ</span><span id="welV">${Math.round(SIM.welfare*100)}%</span></div>
   <input type="range" min="0" max="45" value="${Math.round(SIM.welfare*100)}" style="width:100%;accent-color:var(--accent)" oninput="SIM.welfare=this.value/100;document.getElementById('welV').textContent=this.value+'%'"></div>`;
}
function tabSettings(){
  pbody.innerHTML=`<div class="sec-title">เชื่อมต่อ AI จริง (ไม่บังคับ)</div>
  <div class="hint">เกมทำงานได้ทันทีโดยใช้สมอง Utility AI ในเครื่อง ไม่ต้องใส่ API key เลย<br>
  ถ้าอยากให้ "ความในใจ" ของ NPC ฉลาดขึ้น เสียบ endpoint แบบ OpenAI-compatible ได้ที่นี่ (เก็บไว้ในเบราว์เซอร์เท่านั้น)</div>
  <div class="field"><label>API Endpoint</label><input id="aiEp" placeholder="https://api.openai.com/v1/chat/completions" value="${AI.endpoint}"></div>
  <div class="field"><label>API Key</label><input id="aiKey" type="password" placeholder="sk-..." value="${AI.apiKey}"></div>
  <div class="field"><label>Model</label><input id="aiModel" placeholder="gpt-4o-mini" value="${AI.model}"></div>
  <button class="btn active" onclick="saveAI()">บันทึกการตั้งค่า AI</button>
  <div class="sec-title" style="margin-top:20px">จำนวนประชากร</div>
  <div class="field"><label>จำนวน NPC: <b id="popV">${NPCS.length}</b></label>
   <input type="range" min="30" max="200" step="10" value="${NPCS.length}" style="width:100%;accent-color:var(--accent)"
     oninput="document.getElementById('popV').textContent=this.value" onchange="setPopulation(+this.value)"></div>
  <div class="sec-title" style="margin-top:20px">คำอธิบาย</div>
  <div class="hint">• ลากเมาส์บนแผนที่เพื่อเลื่อน, หมุนล้อเพื่อซูม<br>• คลิกที่จุด NPC เพื่อดูสถานะ ความต้องการ และความคิด<br>• NPC ตัดสินใจเองจากความหิว/พลัง/สนุก/สังคม/เงิน + นิสัยส่วนตัว<br>• พวกเขาจะหางาน ไปทำงาน รับเงิน เสียภาษี กินข้าว ช้อปปิ้ง และพักผ่อนเอง</div>`;
}
function saveAI(){
  AI.endpoint=document.getElementById('aiEp').value.trim();
  AI.apiKey=document.getElementById('aiKey').value.trim();
  AI.model=document.getElementById('aiModel').value.trim()||'gpt-4o-mini';
  localStorage.setItem('ai_endpoint',AI.endpoint);
  localStorage.setItem('ai_key',AI.apiKey);
  localStorage.setItem('ai_model',AI.model);
  alert(AI.enabled()?'บันทึกแล้ว! NPC จะใช้ AI จริงสร้างความคิด':'บันทึกแล้ว (ยังไม่ครบ จะใช้สมองในเครื่องต่อไป)');
}
function setPopulation(n){
  const cur=NPCS.length;
  if(n>cur){ for(let i=cur;i<n;i++) NPCS.push(makeNPC(i)); }
  else NPCS.length=n;
}

/* ---------- NPC card ---------- */
let selectedId=-1;
const npccard=document.getElementById('npccard');
function showNpcCard(n){
  selectedId=n.id;
  const nb=(t,v,c)=>`<div class="nbar"><span class="nt">${t}</span><div class="ntrack"><div class="nf" style="width:${clamp(v,0,100)}%;background:${c}"></div></div></div>`;
  npccard.innerHTML=`<h3>${n.name} <span style="font-weight:400;color:var(--muted)">(${n.age} ปี)</span></h3>
    <div class="role">${n.job||'ว่างงาน'} • <span style="color:${ACT[n.sick?'sick':n.act].color}">${ACT[n.sick?'sick':n.act].label}</span></div>
    ${nb('อิ่ม',n.need.hunger,'#22d3ee')}
    ${nb('พลัง',n.need.energy,'#60a5fa')}
    ${nb('สนุก',n.need.fun,'#ec9bd1')}
    ${nb('สังคม',n.need.social,'#a78bfa')}
    <div class="nbar"><span class="nt">เงิน</span><span style="color:var(--good)">฿${n.money|0}</span></div>
    <div class="think" id="thinkBox">💭 ${n.thought||localThought(n)}</div>`;
  npccard.style.display='block';
  // เรียก AI จริงถ้าเปิดไว้
  aiThought(n).then(t=>{ if(selectedId===n.id){ const tb=document.getElementById('thinkBox'); if(tb)tb.innerHTML='💭 '+t; n.thought=t; }});
}
function positionNpcCard(){
  if(selectedId<0){ npccard.style.display='none'; return; }
  const n=NPCS[selectedId]; if(!n) return;
  const sx=n.x*cam.zoom+cam.x, sy=n.y*cam.zoom+cam.y;
  let left=sx+14, top=sy-10;
  if(left+250>cssW) left=sx-264;
  if(top+200>cssH) top=cssH-210;
  if(top<6) top=6;
  npccard.style.left=Math.max(6,left)+'px';
  npccard.style.top=top+'px';
}

/* ---------- legend ---------- */
function buildLegend(){
  const el=document.getElementById('legend');
  const items=['work','eat','leisure','social','jobhunt','sleep','sick'];
  el.innerHTML=items.map(k=>`<div><i style="background:${ACT[k].color}"></i>${ACT[k].label}</div>`).join('');
}

/* =========================================================================
   INPUT (pan / zoom / click)
   ========================================================================= */
let drag=null;
cv.addEventListener('mousedown',e=>{ drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false}; });
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  cam.x=drag.cx+(e.clientX-drag.x); cam.y=drag.cy+(e.clientY-drag.y);
  if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)drag.moved=true;
});
window.addEventListener('mouseup',e=>{
  if(drag && !drag.moved){ pickNPC(e); }
  drag=null;
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const wx=(mx-cam.x)/cam.zoom, wy=(my-cam.y)/cam.zoom;
  const old=cam.zoom;
  cam.zoom=clamp(cam.zoom*(e.deltaY<0?1.12:0.89),0.3,2.2);
  cam.x=mx-wx*cam.zoom; cam.y=my-wy*cam.zoom;
},{passive:false});
function pickNPC(e){
  const r=cv.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const wx=(mx-cam.x)/cam.zoom, wy=(my-cam.y)/cam.zoom;
  let best=null,bd=14;
  for(const n of NPCS){ const d=Math.hypot(n.x-wx,n.y-wy); if(d<bd){bd=d;best=n;} }
  if(best) showNpcCard(best);
  else { selectedId=-1; npccard.style.display='none'; }
}

/* touch */
let touch=null;
cv.addEventListener('touchstart',e=>{ if(e.touches.length===1){const t=e.touches[0];touch={x:t.clientX,y:t.clientY,cx:cam.x,cy:cam.y,moved:false};}},{passive:true});
cv.addEventListener('touchmove',e=>{ if(touch&&e.touches.length===1){const t=e.touches[0];cam.x=touch.cx+(t.clientX-touch.x);cam.y=touch.cy+(t.clientY-touch.y);if(Math.abs(t.clientX-touch.x)+Math.abs(t.clientY-touch.y)>4)touch.moved=true;}},{passive:true});
cv.addEventListener('touchend',e=>{ if(touch&&!touch.moved){const t=e.changedTouches[0];pickNPC(t);} touch=null;},{passive:true});

/* =========================================================================
   UI controls
   ========================================================================= */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); activeTab=t.dataset.t;
  if(activeTab==='settings') tabSettings(); else renderPanel();
}));
const speedEl=document.getElementById('speed'), speedLbl=document.getElementById('speedLbl');
speedEl.addEventListener('input',()=>{ SIM.speed=+speedEl.value; speedLbl.textContent=SPEED_LBL[SIM.speed]; SIM.paused=(SIM.speed===0); updatePauseBtn(); });
const pauseBtn=document.getElementById('pauseBtn');
pauseBtn.addEventListener('click',()=>{ SIM.paused=!SIM.paused; updatePauseBtn(); });
function updatePauseBtn(){ pauseBtn.textContent=SIM.paused?'▶ เล่น':'⏸ หยุด'; pauseBtn.classList.toggle('active',SIM.paused); }

/* =========================================================================
   INIT
   ========================================================================= */
function init(){
  resize();
  for(let i=0;i<90;i++) NPCS.push(makeNPC(i));
  computeStats();
  buildLegend();
  // จัดกล้องให้เห็นทั้งเมือง (ใช้ขนาด CSS pixels)
  cam.zoom=Math.min(cssW/W, cssH/H)*0.95;
  cam.x=(cssW-W*cam.zoom)/2; cam.y=(cssH-H*cam.zoom)/2;
  speedLbl.textContent=SPEED_LBL[SIM.speed];
  requestAnimationFrame(tick);
}
init();
</script>
</body>
</html>
