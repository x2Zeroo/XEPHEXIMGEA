<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>XEPHEX HUB</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  color: #fff;
  overflow-x: hidden;
}

#bg-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  z-index: -1;
}
#bg-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.45);
}
#bg-gif {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  top: 0; left: 0;
  filter: brightness(0.45);
}
.navbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(10,12,25,0.85);
  padding:10px 20px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  position:sticky;
  top:0;
  z-index:50;
}
.nav-left {
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}
.nav-left img {
  width:36px;
  height:36px;
  border-radius:50%;
  object-fit:cover;
}
.logo-text {
  font-weight:700;
  font-size:18px;
  letter-spacing:1px;
}
.logo-text .blue {color:#00FFC8;}
.logo-text .white {color:#fff;}

.discord-btn {
  display:flex;
  align-items:center;
  gap:8px;
  background:#5865f2;
  border:none;
  color:#fff;
  font-weight:600;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
}
.discord-btn img {
  width:18px;
  height:18px;
}

.hamburger {
  width:42px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:1px solid rgba(255,255,255,0.06);
  border-radius:8px;
  cursor:pointer;
  padding:6px;
}
.hamburger-inner {
  position:relative;
  width:18px;
  height:14px;
}
.hamburger-inner span {
  position:absolute;
  left:0;
  right:0;
  height:2px;
  background:#eafcff;
  border-radius:2px;
  transition:transform .18s,opacity .12s,top .18s;
}
.hamburger-inner span:nth-child(1){top:0}
.hamburger-inner span:nth-child(2){top:6px}
.hamburger-inner span:nth-child(3){top:12px}
.hamburger.open .hamburger-inner span:nth-child(1){top:6px;transform:rotate(45deg)}
.hamburger.open .hamburger-inner span:nth-child(2){opacity:0}
.hamburger.open .hamburger-inner span:nth-child(3){top:6px;transform:rotate(-45deg)}

.menu-dropdown {
  position:absolute;
  right:20px;
  top:60px;
  background:rgba(6,8,18,0.96);
  border-radius:10px;
  min-width:180px;
  box-shadow:0 8px 30px rgba(0,0,0,0.6);
  border:1px solid rgba(255,255,255,0.04);
  overflow:hidden;
  z-index:60;
  opacity:0;
  pointer-events:none;
  transform:translateY(-6px) scale(.98);
  transition:opacity .18s,transform .18s;
}
.menu-dropdown.show {
  opacity:1;
  pointer-events:auto;
  transform:translateY(0) scale(1);
}
.menu-item {
  display:block;
  padding:10px 14px;
  color:#dff6fb;
  text-decoration:none;
  font-weight:600;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.menu-item:last-child {border-bottom:none;}
.menu-item:hover {
  background:rgba(20,30,60,0.5);
  color:#fff;
}
.container {
  max-width: 800px;
  margin: 70px auto;
  background: rgba(15, 18, 40, 0.8);
  padding: 30px 35px;
  border-radius: 12px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
}
.title {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 15px;
  color: #00FFC8;
  text-shadow: 0 0 8px rgba(0, 200, 255, 0.5);
}
.progress-bar {
  background: #2a2a3b;
  border-radius: 8px;
  overflow: hidden;
  margin: 8px 0 15px;
  height: 16px;
}
.progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #4facfe, #00f2fe);
  transition: width 0.5s ease-in-out;
}
button {
  background: #00FFC8;
  border: none;
  color: #fff;
  padding: 10px 25px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  transition: 0.25s;
}
button:hover {
  background: #00a8dd;
  transform: scale(1.03);
}

button:focus,
button:active {
  outline: none !important;
  box-shadow: none !important;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  text-align: center;
}
th, td {
  padding: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}
th {
  color: #00FFC8;
  font-weight: 600;
}
.getkey-btn {
  background: transparent;
  border: 1px solid #00FFC8;
  color: #00FFC8;
  padding: 8px 18px;
  border-radius: 6px;
  font-weight: 500;
  transition: 0.25s;
  margin-top: 12px;
}
.getkey-btn:hover {
  background: #00FFC8;
  color: #fff;
}
.status-active {background:#28a745;padding:4px 10px;border-radius:5px;font-weight:600;font-size:13px;}
.status-expired {background:#ff4444;padding:4px 10px;border-radius:5px;font-weight:600;font-size:13px;}
.status-banned {background:#ff9900;padding:4px 10px;border-radius:5px;font-weight:600;font-size:13px;}
.key-icon {color:gold;margin:0 5px;}
.extend-btn {
  background: transparent;
  border: 1px solid #00f2fe;
  color: #00f2fe;
  padding: 6px 14px;
  border-radius: 6px;
  font-weight: 500;
  transition: 0.25s;
}
.extend-btn:hover {
  background: #00f2fe;
  color: #000;
}
td:first-child {text-align:left;width:420px;}
.copy-btn {
  background: transparent;
  border: 1px solid #ccc;
  color: #ccc;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.25s;
  min-width: 35px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
}
.copy-btn:hover {background:#00FFC8;color:#fff;border-color:#00FFC8;}
.footer {text-align:center;margin-top:25px;opacity:0.7;font-size:13px;}
.th-left {text-align:left;padding-left:120px;}

.neon-mint-green {
  color: #00FFC8;
  text-shadow: 0 0 10px #00FFC8, 0 0 20px #00FFC8, 0 0 40px #00FFC8;
}
</style>
